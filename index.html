<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aquarium — Secret Chat</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sakura Tank">
<meta name="theme-color" content="#ffd1e3">
<link id="pwa-manifest" rel="manifest" href="">
<link id="apple-icon" rel="apple-touch-icon" href="">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffeaf2;
    --panel: #fff8fb;
    --plum: #3b1730;
    --pink: #ff699e;
    --pink-dark: #d93870;
    --pink-soft: #ffd6e6;
    --cream: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100dvh;
    background: var(--bg);
    font-family: 'Mali', sans-serif;
    color: var(--plum);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* โครงสร้างหลักหน้าจอมือถือ */
  .app-shell {
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border-left: 2px solid var(--plum);
    border-right: 2px solid var(--plum);
  }
  @media (max-width: 480px) {
    .app-shell { border-left: none; border-right: none; }
  }

  /* แถบด้านบนสไตล์ */
  .top-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: linear-gradient(180deg, #ffcce0 0%, #ffe6f0 100%);
    border-bottom: 3px solid var(--plum);
  }
  .brand-card {
    display: flex; align-items: center; gap: 8px;
    background: #fff0f6;
    border: 2px solid var(--plum);
    border-radius: 8px;
    padding: 4px 10px;
    box-shadow: 0 2px 0 var(--plum);
  }
  .brand-title {
    font-weight: 700; font-size: 14px; color: var(--plum);
    line-height: 1.1;
  }
  .room-sub {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px; color: #8c4a68;
    margin-top: 2px;
  }
  .top-actions {
    display: flex; align-items: center; gap: 6px;
  }
  .pixel-btn {
    background: #fff; border: 2px solid var(--plum);
    border-radius: 8px; padding: 6px 10px;
    font-family: 'Mali', sans-serif; font-weight: 700;
    font-size: 12px; color: var(--plum);
    cursor: pointer; box-shadow: 0 2px 0 var(--plum);
  }
  .pixel-btn:active { transform: translateY(2px); box-shadow: none; }

  /* โซนตู้ปลา 16-bit */
  .tank-wrapper {
    flex-shrink: 0;
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    max-height: 44dvh;
    background: #98dcff;
    border-bottom: 3px solid var(--plum);
    overflow: hidden;
  }
  canvas#tank {
    width: 100%; height: 100%;
    display: block;
    image-rendering: pixelated;
    cursor: pointer;
  }

  /* ป้ายข้อความล่าสุดบนตู้ปลา + ปุ่มแก้ไขตู้ปลา (ตามภาพตัวอย่าง) */
  .tank-overlay-bottom {
    position: absolute;
    left: 10px; right: 10px; bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    pointer-events: none;
  }
  .tank-pinned-msg {
    background: rgba(255, 255, 255, 0.92);
    border: 2px solid var(--plum);
    border-radius: 10px;
    padding: 5px 11px;
    font-size: 12px; font-weight: 700;
    color: var(--plum);
    box-shadow: 0 2px 0 var(--plum);
    max-width: 62%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tank-pinned-msg.hidden { display: none; }
  .tank-edit-btn {
    pointer-events: auto;
    margin-left: auto;
    background: #f5efe6;
    border: 2px solid var(--plum);
    border-radius: 8px;
    padding: 5px 10px;
    font-family: 'Mali', sans-serif; font-weight: 700;
    font-size: 12px; color: var(--plum);
    cursor: pointer;
    box-shadow: 0 2px 0 var(--plum);
  }
  .tank-edit-btn:active { transform: translateY(2px); box-shadow: none; }

  /* ห้องแชทส่วนตัวด้านล่าง */
  .chat-section {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
  }
  .chat-header {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px;
    background: #ffe0ec;
    border-bottom: 2px dashed #e6a8c2;
    font-size: 12px; font-weight: 700;
  }
  .identity-switch {
    display: flex; align-items: center; gap: 3px;
    background: #fff; border: 2px solid var(--plum);
    border-radius: 20px; padding: 2px;
  }
  .id-pill {
    border: none; background: transparent;
    padding: 2px 10px; border-radius: 16px;
    font-family: 'Mali', sans-serif; font-weight: 700; font-size: 12px;
    color: var(--plum); cursor: pointer;
  }
  .id-pill.active { background: var(--pink); color: #fff; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }
  .msg-row {
    display: flex; flex-direction: column;
    max-width: 78%;
  }
  .msg-row.me { align-self: flex-end; align-items: flex-end; }
  .msg-row.other { align-self: flex-start; align-items: flex-start; }

  .msg-sender {
    font-size: 10px; font-weight: 700;
    color: #8c4a68; margin: 0 6px 2px;
  }
  .msg-bubble {
    padding: 7px 12px;
    border: 2px solid var(--plum);
    border-radius: 14px;
    font-size: 14px; line-height: 1.35;
    word-break: break-word;
    box-shadow: 0 2px 0 rgba(59,23,48,0.18);
  }
  .msg-row.me .msg-bubble {
    background: var(--pink-soft);
    border-bottom-right-radius: 4px;
  }
  .msg-row.other .msg-bubble {
    background: var(--cream);
    border-bottom-left-radius: 4px;
  }
  .msg-time {
    font-size: 9px; color: #9e6580;
    margin: 2px 6px 0;
  }
  .empty-chat {
    text-align: center; color: #a36a84;
    font-size: 13px; margin: auto; padding: 16px;
  }

  /* แถบพิมพ์แชทด้านล่างสุด */
  .chat-input-bar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    background: #ffd6e6;
    border-top: 3px solid var(--plum);
  }
  .chat-input {
    flex: 1;
    border: 2px solid var(--plum);
    border-radius: 20px;
    padding: 8px 14px;
    font-family: 'Mali', sans-serif;
    font-size: 14px; color: var(--plum);
    background: #fff;
    outline: none;
  }
  .send-btn {
    background: var(--pink); color: #fff;
    border: 2px solid var(--plum);
    border-radius: 20px;
    padding: 8px 16px;
    font-family: 'Mali', sans-serif; font-weight: 700;
    font-size: 14px; cursor: pointer;
    box-shadow: 0 2px 0 var(--plum);
  }
  .send-btn:active { transform: translateY(2px); box-shadow: none; }

  /* หน้าต่างแก้ไขตู้ปลา & ฝังข้อความในตู้ */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(59, 23, 48, 0.58);
    display: none; align-items: center; justify-content: center;
    padding: 16px; z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    width: 100%; max-width: 390px;
    background: #fff6fa;
    border: 3px solid var(--plum);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 6px 0 var(--plum);
  }
  .modal-title {
    font-weight: 700; font-size: 16px;
    margin: 0 0 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .setting-group { margin-bottom: 14px; }
  .setting-label {
    display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px;
  }
  .tank-msg-form {
    display: flex; gap: 6px;
  }
  .tank-msg-input {
    flex: 1;
    border: 2px solid var(--plum);
    border-radius: 10px;
    padding: 8px 10px;
    font-family: 'Mali', sans-serif; font-size: 13px;
    background: #fff; color: var(--plum); outline: none;
  }
  .tank-msg-submit {
    background: var(--pink); color: #fff;
    border: 2px solid var(--plum); border-radius: 10px;
    padding: 8px 12px;
    font-family: 'Mali', sans-serif; font-weight: 700; font-size: 13px;
    cursor: pointer; box-shadow: 0 2px 0 var(--plum);
  }
  .tank-msg-submit:active { transform: translateY(2px); box-shadow: none; }

  .freq-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  }
  .freq-btn {
    background: #fff; border: 2px solid var(--plum);
    border-radius: 8px; padding: 6px 4px;
    font-family: 'Mali', sans-serif; font-size: 12px; font-weight: 700;
    color: var(--plum); cursor: pointer;
  }
  .freq-btn.active { background: var(--pink); color: #fff; }

  .danger-btn {
    width: 100%; padding: 10px;
    background: #ffebf0; color: #c91e56;
    border: 2px solid #c91e56; border-radius: 10px;
    font-family: 'Mali', sans-serif; font-weight: 700; font-size: 13px;
    cursor: pointer;
  }
  .danger-btn:active { background: #ffd1dc; }
  .status-dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: #38c172; margin-right: 5px;
  }
</style>
</head>
<body>

<div class="app-shell">
  <!-- แถบด้านบน -->
  <div class="top-bar">
    <div class="brand-card">
      <span style="font-size:20px;">💗</span>
      <div>
        <div class="brand-title">Aquarium</div>
        <div class="room-sub" id="room-label">W&B</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="pixel-btn" id="btn-clear-tank" title="ล้างข้อความในตู้ปลา">🧹 ล้างตู้</button>
    </div>
  </div>

  <!-- ตู้ปลา 16-bit Pixel Art -->
  <div class="tank-wrapper">
    <canvas id="tank" width="320" height="240"></canvas>
    <div class="tank-overlay-bottom">
      <div class="tank-pinned-msg hidden" id="pinned-bubble"></div>
      <button class="tank-edit-btn" id="btn-open-tank-modal">แก้ไขตู้ปลา</button>
    </div>
  </div>

  <!-- ห้องแชทส่วนตัว (แยกจากข้อความตู้ปลา) -->
  <div class="chat-section">
    <div class="chat-header">
      <div><span class="status-dot"></span>Aquarium</div>
      <div class="identity-switch" title="เลือกชื่อของคุณบนเครื่องนี้">
        <button class="id-pill" data-user="Well">Well</button>
        <button class="id-pill" data-user="Bae">Bae</button>
      </div>
    </div>

    <div class="chat-messages" id="chat-list">
      <div class="empty-chat">กำลังเชื่อมต่อห้องลับ...</div>
    </div>

    <form class="chat-input-bar" id="chat-form">
      <input type="text" class="chat-input" id="msg-input" placeholder="พิมพ์ข้อความแชทหากัน..." autocomplete="off" maxlength="200">
      <button type="submit" class="send-btn">ส่ง ♡</button>
    </form>
  </div>
</div>

<!-- หน้าต่างแก้ไขตู้ปลา (ใส่ข้อความตู้ปลา / ตั้งความถี่ฟอง / ล้างข้อความตู้ปลา) -->
<div class="modal-backdrop" id="tank-modal">
  <div class="modal-card">
    <div class="modal-title">
      <span>🌸 แก้ไขตู้ปลา & ข้อความในน้ำ</span>
      <button class="pixel-btn" id="btn-close-modal">✕</button>
    </div>

    <div class="setting-group">
      <span class="setting-label">💌 ใส่ข้อความสำหรับลอยในตู้ปลา (แยกจากแชท):</span>
      <form class="tank-msg-form" id="tank-msg-form">
        <input type="text" class="tank-msg-input" id="tank-msg-input" placeholder="เช่น คิดถึงนะ ♡" maxlength="45" autocomplete="off">
        <button type="submit" class="tank-msg-submit">ฝังในตู้</button>
      </form>
    </div>

    <div class="setting-group">
      <span class="setting-label">🫧 ความถี่การลอยฟองข้อความในตู้ปลา:</span>
      <div class="freq-grid" id="freq-options">
        <button type="button" class="freq-btn" data-sec="0">ปิดฟอง (0)</button>
        <button type="button" class="freq-btn" data-sec="12">นานๆ ที (12วิ)</button>
        <button type="button" class="freq-btn" data-sec="6">ปกติ (6วิ)</button>
        <button type="button" class="freq-btn" data-sec="3">บ่อย (3วิ)</button>
        <button type="button" class="freq-btn" data-sec="1.5">รัวๆ (1.5วิ)</button>
      </div>
    </div>

    <div class="setting-group" style="margin-bottom:8px;">
      <button type="button" class="danger-btn" id="modal-clear-tank">🧹 ล้างข้อความในตู้ปลาออกหมด (เหลือแค่ปลา)</button>
    </div>

    <div style="font-size:11px; color:#8c4a68; text-align:center;">
      * แตะที่ตัวตู้ปลาโดยตรงเพื่อโปรยอาหารเม็ดและดาวให้ปลากินได้ทันที 
    </div>
  </div>
</div>

<script>
// 1. สร้าง PWA Icon & Manifest อัตโนมัติ
(function setupPWA() {
  const c = document.createElement('canvas');
  c.width = 192; c.height = 192;
  const x = c.getContext('2d');
  x.fillStyle = '#ffd1e3'; x.fillRect(0, 0, 192, 192);
  x.fillStyle = '#ff699e';
  const heart = [
    "0011001100",
    "0111111110",
    "1111111111",
    "1111111111",
    "0111111110",
    "0011111100",
    "0001111000",
    "0000110000"
  ];
  heart.forEach((row, r) => {
    [...row].forEach((ch, col) => {
      if (ch === '1') x.fillRect(26 + col * 14, 42 + r * 14, 14, 14);
    });
  });
  const iconUrl = c.toDataURL('image/png');
  document.getElementById('apple-icon').href = iconUrl;
  const manifest = {
    name: "Sakura Tank Secret Chat",
    short_name: "Sakura Tank",
    start_url: location.href,
    display: "standalone",
    background_color: "#ffeaf2",
    theme_color: "#ffd1e3",
    icons: [{ src: iconUrl, sizes: "192x192", type: "image/png" }]
  };
  document.getElementById('pwa-manifest').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
})();

// 2. เชื่อมต่อ Firebase Realtime Database
const params = new URLSearchParams(location.search);
const ROOM_ID = (params.get('room') || 'PINK-02').toUpperCase();
document.getElementById('room-label').textContent = ROOM_ID;
const DB_BASE = `https://aquarium-a30ca-default-rtdb.asia-southeast1.firebasedatabase.app/sakura_tanks/${ROOM_ID}`;

let currentUser = localStorage.getItem('sakura_user') || 'Well';
let bubbleIntervalSec = parseFloat(localStorage.getItem('sakura_freq') || '6');

// สลับตัวตน Well / Bae
const idPills = document.querySelectorAll('.id-pill');
function updateUserUI() {
  idPills.forEach(btn => btn.classList.toggle('active', btn.dataset.user === currentUser));
}
idPills.forEach(btn => {
  btn.addEventListener('click', () => {
    currentUser = btn.dataset.user;
    localStorage.setItem('sakura_user', currentUser);
    updateUserUI();
    renderChat();
  });
});
updateUserUI();

// ตั้งค่าความถี่ฟอง
const freqBtns = document.querySelectorAll('.freq-btn');
function updateFreqUI() {
  freqBtns.forEach(btn => btn.classList.toggle('active', parseFloat(btn.dataset.sec) === bubbleIntervalSec));
}
freqBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    bubbleIntervalSec = parseFloat(btn.dataset.sec);
    localStorage.setItem('sakura_freq', bubbleIntervalSec);
    updateFreqUI();
  });
});
updateFreqUI();

// เปิด-ปิดหน้าต่างแก้ไขตู้ปลา
const modal = document.getElementById('tank-modal');
document.getElementById('btn-open-tank-modal').onclick = () => modal.classList.add('open');
document.getElementById('btn-close-modal').onclick = () => modal.classList.remove('open');
modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('open'); };

let chatHistory = [];
let tankMessages = [];
let lastKnownChatCount = -1;
let lastKnownTankHash = '';

function updatePinnedTankLabel() {
  const el = document.getElementById('pinned-bubble');
  if (!tankMessages || tankMessages.length === 0) {
    el.classList.add('hidden');
    el.textContent = '';
  } else {
    const latest = tankMessages[tankMessages.length - 1];
    el.textContent = `${latest.sender} ${latest.text}`;
    el.classList.remove('hidden');
  }
}

// ดึงข้อมูลแบบเรียลไทม์ (แยกแชทกับข้อความตู้ปลาอิสระ)
async function syncFirebase() {
  try {
    const res = await fetch(`${DB_BASE}.json`);
    const data = await res.json();
    if (!data) {
      if (lastKnownChatCount === -1) {
        document.getElementById('chat-list').innerHTML = '<div class="empty-chat">ยังไม่มีข้อความแชท เริ่มพิมพ์คุยกันได้เลย ♡</div>';
        lastKnownChatCount = 0;
      }
      return;
    }

    // 1) ข้อมูลห้องแชท
    const rawChat = data.chat_history ? Object.values(data.chat_history) : [];
    rawChat.sort((a, b) => (a.ts || 0) - (b.ts || 0));
    if (rawChat.length !== lastKnownChatCount) {
      chatHistory = rawChat;
      lastKnownChatCount = rawChat.length;
      renderChat();
    }

    // 2) ข้อมูลข้อความในตู้ปลา (แยกอิสระ)
    const rawTank = Array.isArray(data.tank_bubbles) ? data.tank_bubbles : [];
    const tankHash = JSON.stringify(rawTank);
    if (tankHash !== lastKnownTankHash) {
      const isAdded = lastKnownTankHash !== '' && rawTank.length > tankMessages.length;
      tankMessages = rawTank;
      lastKnownTankHash = tankHash;
      updatePinnedTankLabel();
      if (tankMessages.length === 0) activeBubbles = [];
      if (isAdded && bubbleIntervalSec > 0) {
        const latest = tankMessages[tankMessages.length - 1];
        spawnBubble(`${latest.sender} ${latest.text}`);
      }
    }
  } catch (err) {
    console.error('Sync error:', err);
  }
}

function renderChat() {
  const list = document.getElementById('chat-list');
  if (chatHistory.length === 0) {
    list.innerHTML = '<div class="empty-chat">ยังไม่มีข้อความแชท เริ่มพิมพ์คุยกันได้เลย ♡</div>';
    return;
  }
  list.innerHTML = chatHistory.map(m => {
    const isMe = m.sender === currentUser;
    const timeStr = m.ts ? new Date(m.ts).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : '';
    return `
      <div class="msg-row ${isMe ? 'me' : 'other'}">
        <div class="msg-sender">${escapeHTML(m.sender || 'Well')}</div>
        <div class="msg-bubble">${escapeHTML(m.text)}</div>
        <div class="msg-time">${timeStr}</div>
      </div>
    `;
  }).join('');
  list.scrollTop = list.scrollHeight;
}

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

// ส่งข้อความในช่องแชทด้านล่าง (ไม่ไปปนกับตู้ปลา)
document.getElementById('chat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  const newMsg = { sender: currentUser, text, ts: Date.now() };
  chatHistory.push(newMsg);
  lastKnownChatCount = chatHistory.length;
  renderChat();

  try {
    await fetch(`${DB_BASE}/chat_history.json`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(newMsg)
    });
  } catch (err) {
    console.error('Chat send error:', err);
  }
});

// ใส่ข้อความสำหรับตู้ปลาโดยเฉพาะ
document.getElementById('tank-msg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('tank-msg-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  modal.classList.remove('open');

  const newTankMsg = { sender: currentUser, text, ts: Date.now() };
  const updatedTank = [...tankMessages, newTankMsg].slice(-8);
  tankMessages = updatedTank;
  lastKnownTankHash = JSON.stringify(updatedTank);
  updatePinnedTankLabel();

  if (bubbleIntervalSec > 0) {
    spawnBubble(`${newTankMsg.sender} ${newTankMsg.text}`);
  }
  dropFood(160, 24);

  try {
    await fetch(`${DB_BASE}/tank_bubbles.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updatedTank)
    });
  } catch (err) {
    console.error('Tank msg error:', err);
  }
});

// ล้างข้อความในตู้ปลาออกให้หมด (เหลือแค่ปลา)
async function clearTankMessages() {
  tankMessages = [];
  activeBubbles = [];
  lastKnownTankHash = '[]';
  updatePinnedTankLabel();
  modal.classList.remove('open');
  try {
    await fetch(`${DB_BASE}/tank_bubbles.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify([])
    });
  } catch (err) {
    console.error('Clear tank error:', err);
  }
}
document.getElementById('btn-clear-tank').onclick = clearTankMessages;
document.getElementById('modal-clear-tank').onclick = clearTankMessages;

setInterval(syncFirebase, 1800);
syncFirebase();

// 3. ระบบวาดตู้ปลา 16-bit Pixel Art รายละเอียดสูง (มีเส้นขอบดำ)
const canvas = document.getElementById('tank');
const ctx = canvas.getContext('2d');
const W = 320, H = 240;

// ฟังก์ชันวาด Sprite Pixel Art จากตารางสี
function drawSprite(grid, palette, cx, cy, flipX = false, scale = 1) {
  const h = grid.length;
  const w = grid[0].length;
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));
  if (flipX) ctx.scale(-scale, scale);
  else ctx.scale(scale, scale);
  const ox = -Math.floor(w / 2);
  const oy = -Math.floor(h / 2);
  for (let r = 0; r < h; r++) {
    const row = grid[r];
    for (let c = 0; c < w; c++) {
      const ch = row[c];
      if (ch !== '.' && palette[ch]) {
        ctx.fillStyle = palette[ch];
        ctx.fillRect(ox + c, oy + r, 1, 1);
      }
    }
  }
  ctx.restore();
}

// พาเลตต์สีและตัวละคร 16-bit มีขอบดำตามภาพตัวอย่าง
const PAL = {
  'K': '#231524', // ขอบดำเข้ม
  'W': '#ffffff', // ขาวไฮไลท์
  'P': '#ff699e', // ชมพูหลัก
  'L': '#ffb3d1', // ชมพูอ่อน
  'D': '#c9386b', // ชมพูเข้มเงา
  'O': '#ff5e3a', // ส้มปลาคาร์ป
  'Y': '#ffe066', // เหลืองปลาเทวดา
  'B': '#4a6b82', // ลายฟ้าเข้ม
  'C': '#d6e6ff', // ฟ้าอ่อนหมึก
  'S': '#8ea8d8', // เงาหมึก
  'T': '#d9a45b', // น้ำตาลปลาปักเป้า
  'M': '#fff1d0', // ท้องครีม
  'R': '#ff85a2'  // ปลาดาว
};

// 1. ปลากัดสีชมพูหางพริ้ว (ตัวเอกตรงกลาง)

  "..KLPPPPPPPPLLLLLPPPK...",
  ".KLPPWPPPPPPPLLLPPPPPK..",
  ".KLPPKPPPPPPPLLPPPPPPK..",
  ".KLPPPPPPPPPPLLPPPPPPK..",
  "..KLPPPPPPPPLLLPPPPPPK..",
  "...KLLPPPPPLKKKLLLLPK...",
  "....KLLPPPLK...KKKKK....",
  ".....KKKKKK............."
];

// 2. ปลาคาร์ปขาว-ส้ม
const SPRITE_KOI = [

  ".......KKWWWWWWKK......",
  "..KK..KWWOOOWWWWK......",
  ".KWWKKWWOOOOOWWKWK.....",

const SPRITE_ANGEL = [

  "......KYYYYK.......",
  ".....KYYBBYYK......",
  "....KYYYBBYYYK.....",
  "..KKYYYYBBYYYYK....",
  ".KYYYYYYBBYYYYYK...",
  "..KKYYYYBBYYYYK....",

  "......KYYYYK.......",

const SPRITE_PUFFER = [

  "..KTTTTTTTTTTK..",
  ".KTTTTTTTTWTTTK.",
  "KKTTTTTTTTKTTTTK",

const SPRITE_JELLY = [

  ".KLLLLLLLLLLK.",

  "..KCCCCCCCCK..",

const SPRITE_STAR = [
  ".....KK.....",

  "KKKKRRRRKKKK",
  ".KRRRRRRRRK.",
  "..KRRRRRRK..",
  ".KRRK..KRRK.",
  "KKK......KKK"
];

const fishes = [
  { x: 165, y: 112, vx: 0.38, vy: 0.1, dir: -1, sprite: SPRITE_BETTA, scale: 1.4, isJelly: false },
  { x: 115, y: 155, vx: 0.45, vy: -0.08, dir: 1, sprite: SPRITE_KOI, scale: 1.25, isJelly: false },
  { x: 205, y: 152, vx: -0.35, vy: 0.1, dir: -1, sprite: SPRITE_ANGEL, scale: 1.25, isJelly: false },
  { x: 252, y: 150, vx: -0.3, vy: -0.06, dir: -1, sprite: SPRITE_PUFFER, scale: 1.2, isJelly: false },
  { x: 82, y: 82, vx: 0.18, vy: -0.15, dir: 1, sprite: SPRITE_JELLY, scale: 1.25, isJelly: true },
  { x: 235, y: 76, vx: -0.2, vy: 0.14, dir: 1, sprite: SPRITE_OCTO, scale: 1.2, isJelly: true },
  { x: 64, y: 138, vx: 0.16, vy: 0.12, dir: 1, sprite: SPRITE_JELLY, scale: 1.05, isJelly: true }
];

const petals = Array.from({ length: 16 }, () => ({
  x: Math.random() * W,
  y: Math.random() * 195,
  vx: -0.18 - Math.random() * 0.2,
  vy: 0.2 + Math.random() * 0.22,
  phase: Math.random() * Math.PI * 2
}));

let foods = [];
let activeBubbles = [];
let bubbleTimer = 0;
let msgCycleIndex = 0;

function dropFood(x, y) {
  const types = ['pellet', 'star_y', 'star_o', 'star_g'];
  for (let i = 0; i < 5; i++) {
    foods.push({
      x: x + (Math.random() - 0.5) * 34,
      y: y + i * 8,
      vy: 0.38 + Math.random() * 0.2,
      kind: types[i % types.length]
    });
  }
}

canvas.addEventListener('pointerdown', (e) => {
  const rect = canvas.getBoundingClientRect();
  dropFood((e.clientX - rect.left) * (W / rect.width), (e.clientY - rect.top) * (H / rect.height));
});

function spawnBubble(text) {
  if (!text) return;
  activeBubbles.push({
    text,
    x: 80 + Math.random() * 160,
    y: 192,
    vy: -0.38,
    wobble: Math.random() * Math.PI * 2,
    alpha: 1
  });
  if (activeBubbles.length > 3) activeBubbles.shift();
}

function drawCoralBranch(x, y, mainCol, lightCol) {
  ctx.fillStyle = '#3b1730';
  ctx.fillRect(x - 1, y - 42, 8, 44);
  ctx.fillRect(x - 13, y - 34, 14, 7);
  ctx.fillRect(x - 13, y - 48, 7, 16);
  ctx.fillRect(x + 6, y - 28, 13, 7);
  ctx.fillRect(x + 12, y - 42, 7, 16);

  ctx.fillStyle = mainCol;
  ctx.fillRect(x, y - 41, 6, 42);
  ctx.fillRect(x - 12, y - 33, 13, 5);
  ctx.fillRect(x - 12, y - 47, 5, 15);
  ctx.fillRect(x + 6, y - 27, 12, 5);
  ctx.fillRect(x + 13, y - 41, 5, 15);

  ctx.fillStyle = lightCol;
  ctx.fillRect(x + 1, y - 40, 2, 38);
  ctx.fillRect(x - 11, y - 46, 2, 12);
}

function drawEnvironment() {
  // ไล่เฉดสีน้ำทะเลพาสเทล
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#c2ecff');
  grad.addColorStop(0.65, '#8dd4f7');
  grad.addColorStop(1, '#75c2eb');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // ขอบตู้กระจกด้านบนและด้านข้าง
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(0, 0, W, 14);
  ctx.fillStyle = '#5c4b6e';
  ctx.fillRect(0, 0, 4, H);
  ctx.fillRect(W - 4, 0, 4, H);

  // ซุ้มประตูโทริอิซากุระ 16-bit ตรงกลาง
  ctx.fillStyle = '#4a2540'; // ขอบเสา
  ctx.fillRect(102, 46, 116, 9);
  ctx.fillRect(110, 62, 100, 7);
  ctx.fillRect(120, 52, 12, 144);
  ctx.fillRect(188, 52, 12, 144);

  ctx.fillStyle = '#c87a98'; // ตัวเสาชมพูตุ่น
  ctx.fillRect(104, 47, 112, 7);
  ctx.fillRect(112, 63, 96, 5);
  ctx.fillRect(122, 53, 8, 142);
  ctx.fillRect(190, 53, 8, 142);

  ctx.fillStyle = '#e8a5be'; // ไฮไลท์เสา
  ctx.fillRect(123, 54, 2, 138);
  ctx.fillRect(191, 54, 2, 138);

  // ปะการังซ้ายและขวา
  drawCoralBranch(44, 196, '#e87a9e', '#ffb8d1');
  drawCoralBranch(268, 196, '#f2a2be', '#ffd9e8');

  // พื้นทรายด้านล่าง
  ctx.fillStyle = '#e8cfa6';
  ctx.fillRect(4, 194, W - 8, 46);
  ctx.fillStyle = '#d4b483';
  ctx.fillRect(4, 194, W - 8, 4);
  ctx.fillStyle = '#f5e4c8';
  ctx.fillRect(20, 202, 80, 4);
  ctx.fillRect(190, 206, 90, 4);

  // หอยไข่มุกตรงกลางพื้นทราย (มีขอบดำ + ไข่มุกเรืองแสง)
  ctx.fillStyle = '#3b1730';
  ctx.beginPath(); ctx.arc(160, 194, 20, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#d99bc2';
  ctx.beginPath(); ctx.arc(160, 194, 18, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#f7d6eb';
  ctx.beginPath(); ctx.arc(160, 194, 13, Math.PI, 0); ctx.fill();
  // ไข่มุกสีขาว
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(160, 189, 7, 0, Math.PI * 2); ctx.fill();
  // ฐานหอยล่าง
  ctx.fillStyle = '#3b1730';
  ctx.fillRect(138, 193, 44, 7);
  ctx.fillStyle = '#e8a5be';
  ctx.fillRect(140, 194, 40, 5);

  // หอยด้านซ้ายที่มีหมึกน้อยนอนอยู่
  ctx.fillStyle = '#3b1730';
  ctx.beginPath(); ctx.arc(62, 192, 18, Math.PI * 0.85, Math.PI * 0.15); ctx.fill();
  ctx.fillStyle = '#b8d0e8';
  ctx.beginPath(); ctx.arc(62, 192, 16, Math.PI * 0.85, Math.PI * 0.15); ctx.fill();
  drawSprite(SPRITE_OCTO, PAL, 62, 192, false, 1.1);

  // ปลาดาว 2 ตัวบนทรายด้านขวา
  drawSprite(SPRITE_STAR, PAL, 218, 200, false, 1.35);
  drawSprite(SPRITE_STAR, PAL, 254, 205, false, 1.45);
}

let frame = 0;
let lastTime = performance.now();

function loop(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  frame++;

  drawEnvironment();

  // กลีบดอกซากุระ 16-bit ร่วง
  petals.forEach(p => {
    p.x += p.vx + Math.sin(frame * 0.03 + p.phase) * 0.18;
    p.y += p.vy;
    if (p.y > 194) { p.y = 14; p.x = 12 + Math.random() * (W - 24); }
    if (p.x < 8) p.x = W - 12;
    const px = Math.round(p.x), py = Math.round(p.y);
    ctx.fillStyle = '#ff9ec0';
    ctx.fillRect(px, py, 5, 3);
    ctx.fillStyle = '#ffe3ee';
    ctx.fillRect(px + 1, py, 3, 2);
  });

  // อาหารเม็ดและอาหารรูปดาว
  foods.forEach((fd, idx) => {
    fd.y += fd.vy;
    const fx = Math.round(fd.x), fy = Math.round(fd.y);
    ctx.fillStyle = '#3b1730';
    ctx.fillRect(fx - 1, fy - 1, 6, 6);
    ctx.fillStyle = fd.kind === 'star_y' ? '#ffe066' : fd.kind === 'star_g' ? '#7ae582' : '#ff8c42';
    ctx.fillRect(fx, fy, 4, 4);
    if (fd.y >= 194) foods.splice(idx, 1);
  });

  // อัปเดตการว่ายน้ำของปลา
  fishes.forEach(f => {
    if (foods.length > 0 && !f.isJelly) {
      const target = foods[0];
      const dx = target.x - f.x;
      const dy = target.y - f.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 10) {
        foods.shift();
      } else {
        f.x += (dx / dist) * 0.85;
        f.y += (dy / dist) * 0.65;
        f.dir = dx >= 0 ? 1 : -1;
      }
    } else {
      f.x += f.vx;
      f.y += f.vy + Math.sin(frame * 0.035 + f.x * 0.06) * 0.14;
      if (f.x < 26 || f.x > W - 26) { f.vx *= -1; f.dir *= -1; }
      if (f.y < 28 || f.y > 172) f.vy *= -1;
    }
    const flip = f.isJelly ? false : (f.dir < 0);
    drawSprite(f.sprite, PAL, f.x, f.y, flip, f.scale);
  });

  // ปล่อยฟองข้อความตามความถี่ที่เลือก
  if (bubbleIntervalSec > 0 && tankMessages.length > 0) {
    bubbleTimer += dt;
    if (bubbleTimer >= bubbleIntervalSec) {
      bubbleTimer = 0;
      const m = tankMessages[msgCycleIndex % tankMessages.length];
      msgCycleIndex++;
      spawnBubble(`${m.sender} ${m.text}`);
    }
  }

  // วาดฟองข้อความลอยขึ้นด้านบน
  activeBubbles.forEach((b, idx) => {
    b.y += b.vy;
    const bx = Math.round(b.x + Math.sin(frame * 0.05 + b.wobble) * 4);
    const by = Math.round(b.y);
    if (by < 34) b.alpha -= 0.03;

    ctx.save();
    ctx.globalAlpha = Math.max(0, b.alpha);
    ctx.font = 'bold 10px Mali, sans-serif';
    const tw = ctx.measureText(b.text).width;
    const pad = 7;
    const boxW = Math.min(tw + pad * 2, W - 20);
    const drawX = Math.max(10, Math.min(W - boxW - 10, bx - boxW / 2));

    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.strokeStyle = '#3b1730';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(drawX, by - 12, boxW, 20, 8);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#3b1730';
    ctx.fillText(b.text, drawX + pad, by + 1, boxW - pad * 2);
    ctx.restore();

    if (b.alpha <= 0 || by < 14) activeBubbles.splice(idx, 1);
  });

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
