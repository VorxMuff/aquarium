<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aquarium — Secret Chat</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sakura Tank">
<meta name="theme-color" content="#ffd1e3">
<link id="pwa-manifest" rel="manifest" href="">
<link id="apple-icon" rel="apple-touch-icon" href="">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffeaf2;
    --panel: #fff8fb;
    --plum: #3b1730;
    --pink: #ff699e;
    --pink-soft: #ffd6e6;
    --cream: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100dvh;
    background: var(--bg);
    font-family: 'Mali', sans-serif;
    color: var(--plum);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .app-shell {
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border-left: 2px solid var(--plum);
    border-right: 2px solid var(--plum);
  }
  @media (max-width: 480px) {
    .app-shell { border-left: none; border-right: none; }
  }

  .top-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: linear-gradient(180deg, #ffcce0 0%, #ffe6f0 100%);
    border-bottom: 3px solid var(--plum);
  }
  .brand-card {
    display: flex; align-items: center; gap: 8px;
    background: #fff0f6;
    border: 2px solid var(--plum);
    border-radius: 8px;
    padding: 4px 10px;
    box-shadow: 0 2px 0 var(--plum);
  }
  .brand-title { font-weight: 700; font-size: 14px; color: var(--plum); line-height: 1.1; }
  .room-sub { font-family: 'Press Start 2P', monospace; font-size: 8px; color: #8c4a68; margin-top: 2px; }
  .pixel-btn {
    background: #fff; border: 2px solid var(--plum);
    border-radius: 8px; padding: 6px 10px;
    font-family: 'Mali', sans-serif; font-weight: 700;
    font-size: 12px; color: var(--plum);
    cursor: pointer; box-shadow: 0 2px 0 var(--plum);
  }
  .pixel-btn:active { transform: translateY(2px); box-shadow: none; }

  .tank-wrapper {
    flex-shrink: 0;
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    max-height: 44dvh;
    background: #98dcff;
    border-bottom: 3px solid var(--plum);
    overflow: hidden;
  }
  canvas#tank {
    width: 100%; height: 100%;
    display: block;
    image-rendering: pixelated;
    cursor: pointer;
  }

  .tank-overlay-bottom {
    position: absolute;
    left: 10px; right: 10px; bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    pointer-events: none;
  }
  .tank-pinned-msg {
    background: rgba(255, 255, 255, 0.92);
    border: 2px solid var(--plum);
    border-radius: 10px;
    padding: 5px 11px;
    font-size: 12px; font-weight: 700;
    color: var(--plum);
    box-shadow: 0 2px 0 var(--plum);
    max-width: 62%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tank-pinned-msg.hidden { display: none; }
  .tank-edit-btn {
    pointer-events: auto;
    margin-left: auto;
    background: #f5efe6;
    border: 2px solid var(--plum);
    border-radius: 8px;
    padding: 5px 10px;
    font-family: 'Mali', sans-serif; font-weight: 700;
    font-size: 12px; color: var(--plum);
    cursor: pointer;
    box-shadow: 0 2px 0 var(--plum);
  }
  .tank-edit-btn:active { transform: translateY(2px); box-shadow: none; }

  .chat-section {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
  }
  .chat-header {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px;
    background: #ffe0ec;
    border-bottom: 2px dashed #e6a8c2;
    font-size: 12px; font-weight: 700;
  }
  .identity-switch {
    display: flex; align-items: center; gap: 3px;
    background: #fff; border: 2px solid var(--plum);
    border-radius: 20px; padding: 2px;
  }
  .id-pill {
    border: none; background: transparent;
    padding: 2px 10px; border-radius: 16px;
    font-family: 'Mali', sans-serif; font-weight: 700; font-size: 12px;
    color: var(--plum); cursor: pointer;
  }
  .id-pill.active { background: var(--pink); color: #fff; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }
  .msg-row { display: flex; flex-direction: column; max-width: 78%; }
  .msg-row.me { align-self: flex-end; align-items: flex-end; }
  .msg-row.other { align-self: flex-start; align-items: flex-start; }
  .msg-sender { font-size: 10px; font-weight: 700; color: #8c4a68; margin: 0 6px 2px; }
  .msg-bubble {
    padding: 7px 12px;
    border: 2px solid var(--plum);
    border-radius: 14px;
    font-size: 14px; line-height: 1.35;
    word-break: break-word;
    box-shadow: 0 2px 0 rgba(59,23,48,0.18);
  }
  .msg-row.me .msg-bubble { background: var(--pink-soft); border-bottom-right-radius: 4px; }
  .msg-row.other .msg-bubble { background: var(--cream); border-bottom-left-radius: 4px; }
  .msg-time { font-size: 9px; color: #9e6580; margin: 2px 6px 0; }
  .empty-chat { text-align: center; color: #a36a84; font-size: 13px; margin: auto; padding: 16px; }

  .chat-input-bar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    background: #ffd6e6;
    border-top: 3px solid var(--plum);
  }
  .chat-input {
    flex: 1;
    border: 2px solid var(--plum);
    border-radius: 20px;
    padding: 8px 14px;
    font-family: 'Mali', sans-serif;
    font-size: 14px; color: var(--plum);
    background: #fff;
    outline: none;
  }
  .send-btn {
    background: var(--pink); color: #fff;
    border: 2px solid var(--plum);
    border-radius: 20px;
    padding: 8px 16px;
    font-family: 'Mali', sans-serif; font-weight: 700;
    font-size: 14px; cursor: pointer;
    box-shadow: 0 2px 0 var(--plum);
  }
  .send-btn:active { transform: translateY(2px); box-shadow: none; }

  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(59, 23, 48, 0.58);
    display: none; align-items: center; justify-content: center;
    padding: 16px; z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    width: 100%; max-width: 390px;
    background: #fff6fa;
    border: 3px solid var(--plum);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 6px 0 var(--plum);
  }
  .modal-title {
    font-weight: 700; font-size: 16px;
    margin: 0 0 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .setting-group { margin-bottom: 14px; }
  .setting-label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .tank-msg-form { display: flex; gap: 6px; }
  .tank-msg-input {
    flex: 1;
    border: 2px solid var(--plum);
    border-radius: 10px;
    padding: 8px 10px;
    font-family: 'Mali', sans-serif; font-size: 13px;
    background: #fff; color: var(--plum); outline: none;
  }
  .tank-msg-submit {
    background: var(--pink); color: #fff;
    border: 2px solid var(--plum); border-radius: 10px;
    padding: 8px 12px;
    font-family: 'Mali', sans-serif; font-weight: 700; font-size: 13px;
    cursor: pointer; box-shadow: 0 2px 0 var(--plum);
  }
  .freq-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .freq-btn {
    background: #fff; border: 2px solid var(--plum);
    border-radius: 8px; padding: 6px 4px;
    font-family: 'Mali', sans-serif; font-size: 12px; font-weight: 700;
    color: var(--plum); cursor: pointer;
  }
  .freq-btn.active { background: var(--pink); color: #fff; }
  .danger-btn {
    width: 100%; padding: 10px;
    background: #ffebf0; color: #c91e56;
    border: 2px solid #c91e56; border-radius: 10px;
    font-family: 'Mali', sans-serif; font-weight: 700; font-size: 13px;
    cursor: pointer;
  }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #38c172; margin-right: 5px; }
</style>
</head>
<body>

<div class="app-shell">
  <div class="top-bar">
    <div class="brand-card">
      <span style="font-size:20px;">💗</span>
      <div>
        <div class="brand-title">Aquarium</div>
        <div class="room-sub" id="room-label">W♡B</div>
      </div>
    </div>
    <button class="pixel-btn" id="btn-clear-tank">🧹 ล้างตู้</button>
  </div>

  <div class="tank-wrapper">
    <canvas id="tank" width="480" height="360"></canvas>
    <div class="tank-overlay-bottom">
      <div class="tank-pinned-msg hidden" id="pinned-bubble"></div>
      <button class="tank-edit-btn" id="btn-open-tank-modal">แก้ไขตู้ปลา</button>
    </div>
  </div>

  <div class="chat-section">
    <div class="chat-header">
      <div><span class="status-dot"></span>แชทลับเฉพาะสองเรา</div>
      <div class="identity-switch">
        <button class="id-pill" data-user="Well">Well</button>
        <button class="id-pill" data-user="Bae">Bae</button>
      </div>
    </div>

    <div class="chat-messages" id="chat-list">
      <div class="empty-chat">กำลังเชื่อมต่อห้องลับ...</div>
    </div>

    <form class="chat-input-bar" id="chat-form">
      <input type="text" class="chat-input" id="msg-input" placeholder="พิมพ์ข้อความแชทหากัน..." autocomplete="off" maxlength="200">
      <button type="submit" class="send-btn">ส่ง ♡</button>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="tank-modal">
  <div class="modal-card">
    <div class="modal-title">
      <span>🌸 แก้ไขตู้ปลา & ข้อความในน้ำ</span>
      <button class="pixel-btn" id="btn-close-modal">✕</button>
    </div>

    <div class="setting-group">
      <span class="setting-label">💌 ใส่ข้อความสำหรับลอยในตู้ปลา (แยกจากแชท):</span>
      <form class="tank-msg-form" id="tank-msg-form">
        <input type="text" class="tank-msg-input" id="tank-msg-input" placeholder="เช่น คิดถึงนะ ♡" maxlength="45" autocomplete="off">
        <button type="submit" class="tank-msg-submit">ฝังในตู้</button>
      </form>
    </div>

    <div class="setting-group">
      <span class="setting-label">ความถี่การลอยฟองข้อความในตู้ปลา:</span>
      <div class="freq-grid" id="freq-options">
        <button type="button" class="freq-btn" data-sec="0">ปิดฟอง (0)</button>
        <button type="button" class="freq-btn" data-sec="12">นานๆ ที (12วิ)</button>
        <button type="button" class="freq-btn" data-sec="6">ปกติ (6วิ)</button>
        <button type="button" class="freq-btn" data-sec="3">บ่อย (3วิ)</button>
        <button type="button" class="freq-btn" data-sec="1.5">รัวๆ (1.5วิ)</button>
      </div>
    </div>

    <div class="setting-group" style="margin-bottom:8px;">
      <button type="button" class="danger-btn" id="modal-clear-tank">🧹 ล้างข้อความในตู้ปลาออกหมด (เหลือแค่ปลา)</button>
    </div>

    <div style="font-size:11px; color:#8c4a68; text-align:center;">
      * แตะที่ตัวตู้ปลาโดยตรงเพื่อโปรยอาหารเม็ดและดาวให้ปลากินได้ทันที 
    </div>
  </div>
</div>

<script>
// PWA Setup
(function setupPWA() {
  const c = document.createElement('canvas');
  c.width = 192; c.height = 192;
  const x = c.getContext('2d');
  x.fillStyle = '#ffd1e3'; x.fillRect(0, 0, 192, 192);
  x.fillStyle = '#ff699e';
  const heart = ["0011001100","0111111110","1111111111","1111111111","0111111110","0011111100","0001111000","0000110000"];
  heart.forEach((row, r) => [...row].forEach((ch, col) => { if (ch === '1') x.fillRect(26 + col * 14, 42 + r * 14, 14, 14); }));
  const iconUrl = c.toDataURL('image/png');
  document.getElementById('apple-icon').href = iconUrl;
  document.getElementById('pwa-manifest').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify({
    name: "Sakura Tank Secret Chat", short_name: "Sakura Tank", start_url: location.href,
    display: "standalone", background_color: "#ffeaf2", theme_color: "#ffd1e3",
    icons: [{ src: iconUrl, sizes: "192x192", type: "image/png" }]
  }));
})();

// Firebase Setup
const params = new URLSearchParams(location.search);
const ROOM_ID = (params.get('room') || 'PINK-02').toUpperCase();
document.getElementById('room-label').textContent = ROOM_ID;
const DB_BASE = `https://aquarium-a30ca-default-rtdb.asia-southeast1.firebasedatabase.app/sakura_tanks/${ROOM_ID}`;

let currentUser = localStorage.getItem('sakura_user') || 'Well';
let bubbleIntervalSec = parseFloat(localStorage.getItem('sakura_freq') || '6');

const idPills = document.querySelectorAll('.id-pill');
function updateUserUI() { idPills.forEach(b => b.classList.toggle('active', b.dataset.user === currentUser)); }
idPills.forEach(b => b.addEventListener('click', () => { currentUser = b.dataset.user; localStorage.setItem('sakura_user', currentUser); updateUserUI(); renderChat(); }));
updateUserUI();

const freqBtns = document.querySelectorAll('.freq-btn');
function updateFreqUI() { freqBtns.forEach(b => b.classList.toggle('active', parseFloat(b.dataset.sec) === bubbleIntervalSec)); }
freqBtns.forEach(b => b.addEventListener('click', () => { bubbleIntervalSec = parseFloat(b.dataset.sec); localStorage.setItem('sakura_freq', bubbleIntervalSec); updateFreqUI(); }));
updateFreqUI();

const modal = document.getElementById('tank-modal');
document.getElementById('btn-open-tank-modal').onclick = () => modal.classList.add('open');
document.getElementById('btn-close-modal').onclick = () => modal.classList.remove('open');
modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('open'); };

let chatHistory = [], tankMessages = [], lastKnownChatCount = -1, lastKnownTankHash = '';

function updatePinnedTankLabel() {
  const el = document.getElementById('pinned-bubble');
  if (!tankMessages || tankMessages.length === 0) { el.classList.add('hidden'); el.textContent = ''; }
  else { const latest = tankMessages[tankMessages.length - 1]; el.textContent = `${latest.sender} ${latest.text}`; el.classList.remove('hidden'); }
}

async function syncFirebase() {
  try {
    const res = await fetch(`${DB_BASE}.json`);
    const data = await res.json();
    if (!data) {
      if (lastKnownChatCount === -1) { document.getElementById('chat-list').innerHTML = '<div class="empty-chat">ยังไม่มีข้อความแชท เริ่มพิมพ์คุยกันได้เลย ♡</div>'; lastKnownChatCount = 0; }
      return;
    }
    const rawChat = data.chat_history ? Object.values(data.chat_history) : [];
    rawChat.sort((a, b) => (a.ts || 0) - (b.ts || 0));
    if (rawChat.length !== lastKnownChatCount) { chatHistory = rawChat; lastKnownChatCount = rawChat.length; renderChat(); }

    const rawTank = Array.isArray(data.tank_bubbles) ? data.tank_bubbles : [];
    const tankHash = JSON.stringify(rawTank);
    if (tankHash !== lastKnownTankHash) {
      const isAdded = lastKnownTankHash !== '' && rawTank.length > tankMessages.length;
      tankMessages = rawTank; lastKnownTankHash = tankHash; updatePinnedTankLabel();
      if (tankMessages.length === 0) activeBubbles = [];
      if (isAdded && bubbleIntervalSec > 0) { const latest = tankMessages[tankMessages.length - 1]; spawnBubble(`${latest.sender} ${latest.text}`); }
    }
  } catch (err) { console.error(err); }
}

function renderChat() {
  const list = document.getElementById('chat-list');
  if (chatHistory.length === 0) { list.innerHTML = '<div class="empty-chat">ยังไม่มีข้อความแชท เริ่มพิมพ์คุยกันได้เลย ♡</div>'; return; }
  list.innerHTML = chatHistory.map(m => {
    const isMe = m.sender === currentUser;
    const timeStr = m.ts ? new Date(m.ts).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : '';
    return `<div class="msg-row ${isMe ? 'me' : 'other'}"><div class="msg-sender">${escapeHTML(m.sender || 'Well')}</div><div class="msg-bubble">${escapeHTML(m.text)}</div><div class="msg-time">${timeStr}</div></div>`;
  }).join('');
  list.scrollTop = list.scrollHeight;
}

function escapeHTML(str) { return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

document.getElementById('chat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const newMsg = { sender: currentUser, text, ts: Date.now() };
  chatHistory.push(newMsg); lastKnownChatCount = chatHistory.length; renderChat();
  await fetch(`${DB_BASE}/chat_history.json`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newMsg) });
});

document.getElementById('tank-msg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('tank-msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; modal.classList.remove('open');
  const newTankMsg = { sender: currentUser, text, ts: Date.now() };
  const updatedTank = [...tankMessages, newTankMsg].slice(-8);
  tankMessages = updatedTank; lastKnownTankHash = JSON.stringify(updatedTank); updatePinnedTankLabel();
  if (bubbleIntervalSec > 0) spawnBubble(`${newTankMsg.sender} ${newTankMsg.text}`);
  dropFood(240, 30);
  await fetch(`${DB_BASE}/tank_bubbles.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updatedTank) });
});

async function clearTankMessages() {
  tankMessages = []; activeBubbles = []; lastKnownTankHash = '[]'; updatePinnedTankLabel(); modal.classList.remove('open');
  await fetch(`${DB_BASE}/tank_bubbles.json`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify([]) });
}
document.getElementById('btn-clear-tank').onclick = clearTankMessages;
document.getElementById('modal-clear-tank').onclick = clearTankMessages;

setInterval(syncFirebase, 1800);
syncFirebase();

// ========================================================
// 4. ระบบวาดตู้ปลาบนฉากหลัง HD Pixel Art (tank-bg.jpg)
// ========================================================
const canvas = document.getElementById('tank');
const ctx = canvas.getContext('2d');
const W = 480, H = 360;

// โหลดภาพฉากหลังที่ถอดมาจากรูปต้นฉบับของคุณ
const bgImg = new Image();
bgImg.src = 'tank-bg.jpg';
let bgLoaded = false;
bgImg.onload = () => { bgLoaded = true; };

// วาดปลาสไตล์ 16-bit ความละเอียดสูงพร้อมแสงเงาและครีบพริ้วไหว
function drawBettaHD(x, y, dir, t) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.scale(dir, 1);
  const wave = Math.sin(t * 0.14) * 3;

  // หางและครีบบน-ล่างไล่เฉดชมพู
  ctx.fillStyle = '#2d142c';
  ctx.beginPath();
  ctx.moveTo(-8, -6); ctx.quadraticCurveTo(-28, -22 + wave, -32, 0 + wave);
  ctx.quadraticCurveTo(-26, 20 + wave, -8, 7); ctx.fill();

  ctx.fillStyle = '#ff85b3';
  ctx.beginPath();
  ctx.moveTo(-8, -5); ctx.quadraticCurveTo(-26, -19 + wave, -29, 0 + wave);
  ctx.quadraticCurveTo(-24, 17 + wave, -8, 6); ctx.fill();

  ctx.fillStyle = '#ffc2d9';
  ctx.beginPath();
  ctx.moveTo(-10, -2); ctx.quadraticCurveTo(-22, -10 + wave, -24, 0 + wave);
  ctx.quadraticCurveTo(-20, 9 + wave, -10, 3); ctx.fill();

  // ครีบบนและครีบล่าง
  ctx.fillStyle = '#ff699e';
  ctx.strokeStyle = '#2d142c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(-2, -10, 9, 5, -0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-2, 10, 8, 5, 0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // ลำตัว
  ctx.fillStyle = '#ff5c93';
  ctx.beginPath(); ctx.ellipse(2, 0, 15, 8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffb3d1';
  ctx.beginPath(); ctx.ellipse(4, -2, 10, 3, 0, 0, Math.PI * 2); ctx.fill();

  // ตา
  ctx.fillStyle = '#2d142c'; ctx.fillRect(10, -3, 3, 3);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(10, -3, 1.5, 1.5);
  ctx.restore();
}

function drawKoiHD(x, y, dir, t) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.scale(dir, 1);
  const wag = Math.sin(t * 0.16) * 2.5;
  ctx.strokeStyle = '#2d142c'; ctx.lineWidth = 2;

  // หาง
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-22, -7 + wag); ctx.lineTo(-20, 7 + wag); ctx.closePath(); ctx.fill(); ctx.stroke();

  // ตัวสีขาวมุก
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(0, 0, 14, 6.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // ลายส้มแดงโคฮากุ
  ctx.fillStyle = '#ff5238';
  ctx.beginPath(); ctx.ellipse(-3, -1, 5, 3.5, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6, -1.5, 3.5, 2.5, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#2d142c'; ctx.fillRect(9, -2.5, 2.5, 2.5);
  ctx.restore();
}

function drawAngelHD(x, y, dir, t) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.scale(dir, 1);
  ctx.strokeStyle = '#2d142c'; ctx.lineWidth = 2;

  ctx.fillStyle = '#e8f1f8';
  ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(-4, -16); ctx.lineTo(-10, 0); ctx.lineTo(-4, 16); ctx.closePath(); ctx.fill(); ctx.stroke();

  // ลายพาดเหลือง-น้ำเงิน
  ctx.fillStyle = '#ffe066'; ctx.fillRect(-3, -9, 3, 18);
  ctx.fillStyle = '#4a6b82'; ctx.fillRect(2, -7, 2.5, 14);
  ctx.fillStyle = '#2d142c'; ctx.fillRect(6, -2, 2.5, 2.5);
  ctx.restore();
}

function drawPufferHD(x, y, dir, t) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.scale(dir, 1);
  ctx.strokeStyle = '#2d142c'; ctx.lineWidth = 2;

  ctx.fillStyle = '#d9a45b';
  ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff3d6';
  ctx.beginPath(); ctx.arc(0, 1, 9, 0.1 * Math.PI, 0.9 * Math.PI); ctx.fill();
  ctx.fillStyle = '#2d142c'; ctx.fillRect(5, -3, 2.5, 2.5);
  ctx.restore();
}

function drawJellyHD(x, y, color, t) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  const pulse = Math.sin(t * 0.09 + x) * 1.5;
  ctx.strokeStyle = '#2d142c'; ctx.lineWidth = 2;

  // หนวดพลิ้ว
  for (let i = -5; i <= 5; i += 5) {
    ctx.beginPath();
    ctx.moveTo(i, 4);
    ctx.quadraticCurveTo(i + Math.sin(t * 0.1 + i) * 3, 10, i, 15);
    ctx.stroke();
  }
  // หัวแมงกะพรุน
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(0, 2, 10 + pulse * 0.5, Math.PI, 0); ctx.lineTo(10, 4); ctx.lineTo(-10, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2d142c';
  ctx.fillRect(-4, -1, 2, 2); ctx.fillRect(3, -1, 2, 2);
  ctx.restore();
}

function drawDumboOctoHD(x, y, t) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.strokeStyle = '#2d142c'; ctx.lineWidth = 2;
  ctx.fillStyle = '#d6e6ff';
  // หูดัมโบ้
  ctx.beginPath(); ctx.ellipse(-10, -3, 4, 2.5, -0.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(10, -3, 4, 2.5, 0.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // หัวกลม
  ctx.beginPath(); ctx.arc(0, 0, 9, Math.PI, 0); ctx.lineTo(10, 7); ctx.lineTo(-10, 7); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2d142c';
  ctx.fillRect(-4, 0, 2, 2); ctx.fillRect(3, 0, 2, 2);
  ctx.restore();
}

const fishes = [
  { x: 240, y: 165, vx: 0.45, vy: 0.12, dir: 1, type: 'betta' },
  { x: 170, y: 230, vx: 0.55, vy: -0.1, dir: 1, type: 'koi' },
  { x: 300, y: 225, vx: -0.4, vy: 0.12, dir: -1, type: 'angel' },
  { x: 365, y: 220, vx: -0.35, vy: -0.08, dir: -1, type: 'puffer' },
  { x: 130, y: 115, vx: 0.22, vy: -0.18, dir: 1, type: 'jelly_pink' },
  { x: 95, y: 195, vx: 0.18, vy: 0.14, dir: 1, type: 'jelly_pink' },
  { x: 345, y: 110, vx: -0.24, vy: 0.16, dir: -1, type: 'octo' }
];

const petals = Array.from({ length: 16 }, () => ({
  x: Math.random() * W, y: Math.random() * 280,
  vx: -0.25 - Math.random() * 0.25, vy: 0.28 + Math.random() * 0.25,
  phase: Math.random() * Math.PI * 2
}));

let foods = [], activeBubbles = [], bubbleTimer = 0, msgCycleIndex = 0;

function dropFood(x, y) {
  const colors = ['#ffe066', '#ff8c42', '#ff699e', '#6ee7b7'];
  for (let i = 0; i < 6; i++) {
    foods.push({ x: x + (Math.random() - 0.5) * 45, y: y + i * 10, vy: 0.5 + Math.random() * 0.25, col: colors[i % colors.length], isStar: i % 2 === 0 });
  }
}

canvas.addEventListener('pointerdown', (e) => {
  const rect = canvas.getBoundingClientRect();
  dropFood((e.clientX - rect.left) * (W / rect.width), (e.clientY - rect.top) * (H / rect.height));
});

function spawnBubble(text) {
  if (!text) return;
  activeBubbles.push({ text, x: 110 + Math.random() * 260, y: 280, vy: -0.45, wobble: Math.random() * Math.PI * 2, alpha: 1 });
  if (activeBubbles.length > 3) activeBubbles.shift();
}

let frame = 0, lastTime = performance.now();

function loop(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  frame++;

  if (bgLoaded) {
    ctx.drawImage(bgImg, 0, 0, W, H);
  } else {
    ctx.fillStyle = '#98dcff';
    ctx.fillRect(0, 0, W, H);
  }

  // กลีบดอกซากุระร่วง
  petals.forEach(p => {
    p.x += p.vx + Math.sin(frame * 0.03 + p.phase) * 0.25;
    p.y += p.vy;
    if (p.y > 285) { p.y = 18; p.x = 20 + Math.random() * (W - 40); }
    if (p.x < 12) p.x = W - 16;
    ctx.fillStyle = '#ffb3d1';
    ctx.beginPath(); ctx.ellipse(Math.round(p.x), Math.round(p.y), 4, 2.5, 0.3, 0, Math.PI * 2); ctx.fill();
  });

  // อาหารเม็ดและอาหารรูปดาว
  foods.forEach((fd, idx) => {
    fd.y += fd.vy;
    const fx = Math.round(fd.x), fy = Math.round(fd.y);
    ctx.fillStyle = fd.col;
    ctx.strokeStyle = '#2d142c'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(fx, fy, fd.isStar ? 4.5 : 3.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (fd.y >= 285) foods.splice(idx, 1);
  });

  // อัปเดตและวาดฝูงปลา
  fishes.forEach(f => {
    const isFloater = f.type.startsWith('jelly') || f.type === 'octo';
    if (foods.length > 0 && !isFloater) {
      const target = foods[0];
      const dx = target.x - f.x, dy = target.y - f.y, dist = Math.hypot(dx, dy);
      if (dist < 14) foods.shift();
      else { f.x += (dx / dist) * 1.1; f.y += (dy / dist) * 0.85; f.dir = dx >= 0 ? 1 : -1; }
    } else {
      f.x += f.vx;
      f.y += f.vy + Math.sin(frame * 0.035 + f.x * 0.05) * 0.18;
      if (f.x < 42 || f.x > W - 42) { f.vx *= -1; f.dir *= -1; }
      if (f.y < 42 || f.y > 255) f.vy *= -1;
    }

    if (f.type === 'betta') drawBettaHD(f.x, f.y, f.dir, frame);
    else if (f.type === 'koi') drawKoiHD(f.x, f.y, f.dir, frame);
    else if (f.type === 'angel') drawAngelHD(f.x, f.y, f.dir, frame);
    else if (f.type === 'puffer') drawPufferHD(f.x, f.y, f.dir, frame);
    else if (f.type === 'jelly_pink') drawJellyHD(f.x, f.y, '#ffb3d1', frame);
    else if (f.type === 'octo') drawDumboOctoHD(f.x, f.y, frame);
  });

  // ปล่อยฟองข้อความตามความถี่ที่ตั้งค่า
  if (bubbleIntervalSec > 0 && tankMessages.length > 0) {
    bubbleTimer += dt;
    if (bubbleTimer >= bubbleIntervalSec) {
      bubbleTimer = 0;
      const m = tankMessages[msgCycleIndex % tankMessages.length];
      msgCycleIndex++;
      spawnBubble(`${m.sender} ${m.text}`);
    }
  }

  activeBubbles.forEach((b, idx) => {
    b.y += b.vy;
    const bx = Math.round(b.x + Math.sin(frame * 0.05 + b.wobble) * 5);
    const by = Math.round(b.y);
    if (by < 45) b.alpha -= 0.03;

    ctx.save();
    ctx.globalAlpha = Math.max(0, b.alpha);
    ctx.font = 'bold 13px Mali, sans-serif';
    const tw = ctx.measureText(b.text).width;
    const pad = 10;
    const boxW = Math.min(tw + pad * 2, W - 28);
    const drawX = Math.max(14, Math.min(W - boxW - 14, bx - boxW / 2));

    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.strokeStyle = '#3b1730'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(drawX, by - 16, boxW, 26, 11); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3b1730';
    ctx.fillText(b.text, drawX + pad, by + 2, boxW - pad * 2);
    ctx.restore();

    if (b.alpha <= 0 || by < 20) activeBubbles.splice(idx, 1);
  });

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
