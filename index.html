<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aquarium — Secret Chat</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sakura Tank">
<meta name="theme-color" content="#ffd1e3">
<link id="pwa-manifest" rel="manifest" href="">
<link id="apple-icon" rel="apple-touch-icon" href="">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffeaf2;
    --panel: #fff6fa;
    --plum: #4a1938;
    --pink: #ff699e;
    --pink-dark: #d93870;
    --pink-soft: #ffd6e6;
    --cream: #fffdfd;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100dvh;
    background: var(--bg);
    font-family: 'Mali', sans-serif;
    color: var(--plum);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* แถบด้านบน */
  .top-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: linear-gradient(180deg, #ffd6e6 0%, #ffeaf2 100%);
    border-bottom: 3px solid var(--plum);
    z-index: 10;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
  }
  .brand-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px; color: var(--plum);
    line-height: 1.4;
  }
  .room-badge {
    display: inline-block;
    background: var(--pink); color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px; padding: 3px 6px;
    border: 2px solid var(--plum);
    margin-top: 2px;
  }
  .top-actions {
    display: flex; align-items: center; gap: 6px;
  }
  .icon-btn {
    background: #fff; border: 2px solid var(--plum);
    border-radius: 8px; padding: 5px 8px;
    font-family: 'Mali', sans-serif; font-weight: 700;
    font-size: 12px; color: var(--plum);
    cursor: pointer; box-shadow: 0 2px 0 var(--plum);
  }
  .icon-btn:active { transform: translateY(2px); box-shadow: none; }

  /* โซนตู้ปลาด้านบน */
  .tank-section {
    flex-shrink: 0;
    position: relative;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    aspect-ratio: 5 / 3;
    max-height: 38dvh;
    background: #9ee0ff;
    border-bottom: 3px solid var(--plum);
    overflow: hidden;
  }
  canvas#tank {
    width: 100%; height: 100%;
    display: block;
    image-rendering: pixelated;
    cursor: pointer;
  }
  .tank-hint {
    position: absolute; bottom: 6px; right: 8px;
    background: rgba(255,255,255,0.82);
    border: 2px solid var(--plum);
    border-radius: 6px; padding: 2px 7px;
    font-size: 10px; font-weight: 700;
    pointer-events: none;
  }

  /* โซนแชทส่วนตัวด้านล่าง */
  .chat-section {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--panel);
  }
  .chat-header {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px;
    background: #ffe0ec;
    border-bottom: 2px dashed #e6a8c2;
    font-size: 12px; font-weight: 700;
  }
  .identity-switch {
    display: flex; align-items: center; gap: 4px;
    background: #fff; border: 2px solid var(--plum);
    border-radius: 20px; padding: 2px;
  }
  .id-pill {
    border: none; background: transparent;
    padding: 3px 10px; border-radius: 16px;
    font-family: 'Mali', sans-serif; font-weight: 700; font-size: 12px;
    color: var(--plum); cursor: pointer;
  }
  .id-pill.active {
    background: var(--pink); color: #fff;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }
  .msg-row {
    display: flex; flex-direction: column;
    max-width: 78%;
  }
  .msg-row.me { align-self: flex-end; align-items: flex-end; }
  .msg-row.other { align-self: flex-start; align-items: flex-start; }

  .msg-sender {
    font-size: 10px; font-weight: 700;
    color: #8c4a68; margin: 0 6px 2px;
  }
  .msg-bubble {
    padding: 8px 12px;
    border: 2px solid var(--plum);
    border-radius: 14px;
    font-size: 14px; line-height: 1.35;
    word-break: break-word;
    box-shadow: 0 2px 0 rgba(74,25,56,0.18);
  }
  .msg-row.me .msg-bubble {
    background: var(--pink-soft);
    border-bottom-right-radius: 4px;
  }
  .msg-row.other .msg-bubble {
    background: var(--cream);
    border-bottom-left-radius: 4px;
  }
  .msg-time {
    font-size: 9px; color: #9e6580;
    margin: 2px 6px 0;
  }
  .empty-chat {
    text-align: center; color: #a36a84;
    font-size: 13px; margin: auto; padding: 20px;
  }

  /* แถบพิมพ์ข้อความค้างด้านล่าง */
  .chat-input-bar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    background: #ffd6e6;
    border-top: 3px solid var(--plum);
  }
  .chat-input {
    flex: 1;
    border: 2px solid var(--plum);
    border-radius: 20px;
    padding: 9px 14px;
    font-family: 'Mali', sans-serif;
    font-size: 14px; color: var(--plum);
    background: #fff;
    outline: none;
  }
  .send-btn {
    background: var(--pink); color: #fff;
    border: 2px solid var(--plum);
    border-radius: 20px;
    padding: 9px 16px;
    font-family: 'Mali', sans-serif; font-weight: 700;
    font-size: 14px; cursor: pointer;
    box-shadow: 0 2px 0 var(--plum);
  }
  .send-btn:active { transform: translateY(2px); box-shadow: none; }

  /* หน้าต่างตั้งค่าตู้ปลา */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(74, 25, 56, 0.55);
    display: none; align-items: center; justify-content: center;
    padding: 16px; z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    width: 100%; max-width: 380px;
    background: #fff6fa;
    border: 3px solid var(--plum);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 6px 0 var(--plum);
  }
  .modal-title {
    font-weight: 700; font-size: 16px;
    margin: 0 0 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .setting-group { margin-bottom: 14px; }
  .setting-label {
    display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px;
  }
  .freq-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  }
  .freq-btn {
    background: #fff; border: 2px solid var(--plum);
    border-radius: 8px; padding: 6px 4px;
    font-family: 'Mali', sans-serif; font-size: 12px; font-weight: 700;
    color: var(--plum); cursor: pointer;
  }
  .freq-btn.active { background: var(--pink); color: #fff; }
  .danger-btn {
    width: 100%; padding: 10px;
    background: #ffebf0; color: #c91e56;
    border: 2px solid #c91e56; border-radius: 10px;
    font-family: 'Mali', sans-serif; font-weight: 700; font-size: 13px;
    cursor: pointer;
  }
  .danger-btn:active { background: #ffd1dc; }
  .status-dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: #38c172; margin-right: 4px;
  }
</style>
</head>
<body>

  <!-- แถบหัวด้านบน -->
  <div class="top-bar">
    <div class="brand">
      <span style="font-size:20px;">🌸</span>
      <div>
        <div class="brand-title">Aquarium</div>
        <span class="room-badge" id="room-label">W&B</span>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-clear-tank" title="ล้างข้อความในตู้ปลา">🧹 ล้างตู้</button>
      <button class="icon-btn" id="btn-settings" title="ตั้งค่าตู้ปลา">⚙️ ตั้งค่า</button>
    </div>
  </div>

  <!-- ตู้ปลา 16-bit ด้านบน -->
  <div class="tank-section">
    <canvas id="tank" width="400" height="240"></canvas>
    <div class="tank-hint">แตะตู้ปลาเพื่อให้อาหาร</div>
  </div>

  <!-- ห้องแชทส่วนตัวด้านล่าง -->
  <div class="chat-section">
    <div class="chat-header">
      <div><span class="status-dot"></span>แชทลับเฉพาะสองเรา</div>
      <div class="identity-switch" title="เลือกชื่อของคุณบนเครื่องนี้">
        <button class="id-pill" data-user="Well">Well</button>
        <button class="id-pill" data-user="Bae">Bae</button>
      </div>
    </div>

    <div class="chat-messages" id="chat-list">
      <div class="empty-chat">กำลังเชื่อมต่อตู้ปลา...</div>
    </div>

    <form class="chat-input-bar" id="chat-form">
      <input type="text" class="chat-input" id="msg-input" placeholder="พิมพ์ข้อความส่งหากัน..." autocomplete="off" maxlength="120">
      <button type="submit" class="send-btn">ส่ง ♡</button>
    </form>
  </div>

  <!-- หน้าต่างตั้งค่า -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal-card">
      <div class="modal-title">
        <span>⚙️ ตั้งค่าตู้ปลา & ฟองข้อความ</span>
        <button class="icon-btn" id="btn-close-modal">✕</button>
      </div>

      <div class="setting-group">
        <span class="setting-label">ความถี่การลอยฟองข้อความในตู้ปลา:</span>
        <div class="freq-grid" id="freq-options">
          <button class="freq-btn" data-sec="0">ปิดฟอง (0)</button>
          <button class="freq-btn" data-sec="12">นานๆ ที (12วิ)</button>
          <button class="freq-btn" data-sec="6">ปกติ (6วิ)</button>
          <button class="freq-btn" data-sec="3">บ่อย (3วิ)</button>
          <button class="freq-btn" data-sec="1.5">รัวๆ (1.5วิ)</button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label">จัดการข้อความในตู้ปลา:</span>
        <button class="danger-btn" id="modal-clear-tank">🧹 ล้างข้อความในตู้ปลาออกให้หมด (เหลือแค่ปลา)</button>
      </div>

      <div style="font-size:11px; color:#8c4a68; text-align:center;">
        * การล้างข้อความในตู้ปลาจะทำให้ในน้ำโล่งเหลือแค่ปลา แต่ประวัติแชทด้านล่างยังคงอยู่ครบครับ
      </div>
    </div>
  </div>

<script>
// 1. สร้าง PWA Icon & Manifest อัตโนมัติ
(function setupPWA() {
  const c = document.createElement('canvas');
  c.width = 192; c.height = 192;
  const x = c.getContext('2d');
  x.fillStyle = '#ffd1e3'; x.fillRect(0, 0, 192, 192);
  x.fillStyle = '#ff699e';
  const heart = [
    "0011001100",
    "0111111110",
    "1111111111",
    "1111111111",
    "0111111110",
    "0011111100",
    "0001111000",
    "0000110000"
  ];
  heart.forEach((row, r) => {
    [...row].forEach((ch, col) => {
      if (ch === '1') x.fillRect(26 + col * 14, 42 + r * 14, 14, 14);
    });
  });
  const iconUrl = c.toDataURL('image/png');
  document.getElementById('apple-icon').href = iconUrl;
  const manifest = {
    name: "Sakura Tank Secret Chat",
    short_name: "Sakura Tank",
    start_url: location.href,
    display: "standalone",
    background_color: "#ffeaf2",
    theme_color: "#ffd1e3",
    icons: [{ src: iconUrl, sizes: "192x192", type: "image/png" }]
  };
  document.getElementById('pwa-manifest').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
})();

// 2. ตั้งค่าห้องและฐานข้อมูล Firebase
const params = new URLSearchParams(location.search);
const ROOM_ID = (params.get('room') || 'PINK-02').toUpperCase();
document.getElementById('room-label').textContent = ROOM_ID;

const DB_BASE = `https://aquarium-a30ca-default-rtdb.asia-southeast1.firebasedatabase.app/sakura_tanks/${ROOM_ID}`;

// จำตัวตนผู้ใช้บนเครื่องนี้
let currentUser = localStorage.getItem('sakura_user') || 'Well';
let bubbleIntervalSec = parseFloat(localStorage.getItem('sakura_freq') || '6');

const idPills = document.querySelectorAll('.id-pill');
function updateUserUI() {
  idPills.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.user === currentUser);
  });
}
idPills.forEach(btn => {
  btn.addEventListener('click', () => {
    currentUser = btn.dataset.user;
    localStorage.setItem('sakura_user', currentUser);
    updateUserUI();
    renderChat();
  });
});
updateUserUI();

// ตั้งค่าความถี่ฟอง
const freqBtns = document.querySelectorAll('.freq-btn');
function updateFreqUI() {
  freqBtns.forEach(btn => {
    btn.classList.toggle('active', parseFloat(btn.dataset.sec) === bubbleIntervalSec);
  });
}
freqBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    bubbleIntervalSec = parseFloat(btn.dataset.sec);
    localStorage.setItem('sakura_freq', bubbleIntervalSec);
    updateFreqUI();
  });
});
updateFreqUI();

// Modal เปิด-ปิด
const modal = document.getElementById('settings-modal');
document.getElementById('btn-settings').onclick = () => modal.classList.add('open');
document.getElementById('btn-close-modal').onclick = () => modal.classList.remove('open');
modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('open'); };

// สถานะข้อมูล
let chatHistory = [];
let tankMessages = [];
let lastKnownChatCount = -1;

// ดึงข้อมูลแบบเรียลไทม์ (Polling ทุก 1.8 วินาที)
async function syncFirebase() {
  try {
    const res = await fetch(`${DB_BASE}.json`);
    const data = await res.json();
    if (!data) {
      if (lastKnownChatCount === -1) {
        document.getElementById('chat-list').innerHTML = '<div class="empty-chat">ยังไม่มีข้อความ เริ่มพิมพ์ทักทายกันได้เลย ♡</div>';
        lastKnownChatCount = 0;
      }
      return;
    }

    // ประวัติแชททั้งหมด
    const rawChat = data.chat_history ? Object.values(data.chat_history) : (data.messages || []);
    rawChat.sort((a, b) => (a.ts || 0) - (b.ts || 0));

    // ข้อความที่ยังโชว์ในตู้ปลา (ลบออกได้โดยไม่กระทบแชท)
    const rawTank = data.tank_bubbles !== undefined ? (data.tank_bubbles || []) : rawChat.slice(-6);

    tankMessages = rawTank;

    if (rawChat.length !== lastKnownChatCount) {
      const isNewMsg = lastKnownChatCount !== -1 && rawChat.length > lastKnownChatCount;
      chatHistory = rawChat;
      lastKnownChatCount = rawChat.length;
      renderChat();

      // ถ้ามีข้อความใหม่เด้งเข้ามา ให้ปล่อยฟองทันที 1 ลูก (ยกเว้นตั้งปิดฟองไว้)
      if (isNewMsg && bubbleIntervalSec > 0 && tankMessages.length > 0) {
        const latest = tankMessages[tankMessages.length - 1];
        spawnBubble(`${latest.sender}: ${latest.text}`);
      }
    }
  } catch (err) {
    console.error('Sync error:', err);
  }
}

function renderChat() {
  const list = document.getElementById('chat-list');
  if (chatHistory.length === 0) {
    list.innerHTML = '<div class="empty-chat">ยังไม่มีข้อความ เริ่มพิมพ์ทักทายกันได้เลย ♡</div>';
    return;
  }
  list.innerHTML = chatHistory.map(m => {
    const isMe = m.sender === currentUser;
    const timeStr = m.ts ? new Date(m.ts).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : '';
    return `
      <div class="msg-row ${isMe ? 'me' : 'other'}">
        <div class="msg-sender">${escapeHTML(m.sender || 'Well')}</div>
        <div class="msg-bubble">${escapeHTML(m.text)}</div>
        <div class="msg-time">${timeStr}</div>
      </div>
    `;
  }).join('');
  list.scrollTop = list.scrollHeight;
}

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

// ส่งข้อความใหม่
document.getElementById('chat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  const newMsg = { sender: currentUser, text, ts: Date.now() };

  // อัปเดตหน้าจอทันที (Optimistic UI)
  chatHistory.push(newMsg);
  lastKnownChatCount = chatHistory.length;
  renderChat();

  const updatedTank = [...tankMessages, newMsg].slice(-8);
  tankMessages = updatedTank;
  if (bubbleIntervalSec > 0) {
    spawnBubble(`${newMsg.sender}: ${newMsg.text}`);
  }
  dropFood(200, 30);

  // บันทึกลง Firebase ทั้งประวัติแชทและฟองในตู้ปลา
  try {
    await fetch(`${DB_BASE}/chat_history.json`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(newMsg)
    });
    await fetch(`${DB_BASE}/tank_bubbles.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updatedTank)
    });
  } catch (err) {
    console.error('Send error:', err);
  }
});

// ล้างข้อความในตู้ปลาออกให้หมด (เหลือแค่ปลา)
async function clearTankMessages() {
  tankMessages = [];
  activeBubbles = [];
  modal.classList.remove('open');
  try {
    await fetch(`${DB_BASE}/tank_bubbles.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify([])
    });
  } catch (err) {
    console.error('Clear tank error:', err);
  }
}
document.getElementById('btn-clear-tank').onclick = clearTankMessages;
document.getElementById('modal-clear-tank').onclick = clearTankMessages;

setInterval(syncFirebase, 1800);
syncFirebase();

// ==========================================
// 3. ระบบวาดตู้ปลา 16-bit Pixel Art (60fps)
// ==========================================
const canvas = document.getElementById('tank');
const ctx = canvas.getContext('2d');
const W = 400, H = 240;

const fishes = [
  { x: 180, y: 110, vx: 0.55, vy: 0.15, dir: 1, color: '#ff5c93', fin: '#ff9ec0', size: 1.2, type: 'betta' },
  { x: 110, y: 155, vx: -0.65, vy: -0.1, dir: -1, color: '#ffffff', spot: '#ff5238', size: 1.0, type: 'koi' },
  { x: 280, y: 145, vx: 0.45, vy: 0.12, dir: 1, color: '#ffe66d', stripe: '#3a506b', size: 0.95, type: 'angel' },
  { x: 130, y: 75, vx: 0.25, vy: -0.2, dir: 1, color: '#ffb3d1', size: 0.9, type: 'jelly' },
  { x: 270, y: 80, vx: -0.3, vy: 0.18, dir: -1, color: '#c8d8ff', size: 0.85, type: 'jelly' },
  { x: 310, y: 165, vx: -0.4, vy: 0.05, dir: -1, color: '#e6b873', size: 0.85, type: 'puffer' }
];

const petals = Array.from({ length: 18 }, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  vx: -0.2 - Math.random() * 0.3,
  vy: 0.25 + Math.random() * 0.3,
  phase: Math.random() * Math.PI * 2
}));

let foods = [];
let activeBubbles = [];
let bubbleTimer = 0;
let msgCycleIndex = 0;

function dropFood(x, y) {
  for (let i = 0; i < 4; i++) {
    foods.push({
      x: x + (Math.random() - 0.5) * 36,
      y: y + Math.random() * 12,
      vy: 0.45 + Math.random() * 0.25
    });
  }
}

canvas.addEventListener('pointerdown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  dropFood((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
});

function spawnBubble(text) {
  if (!text) return;
  activeBubbles.push({
    text,
    x: 90 + Math.random() * 220,
    y: 195,
    vy: -0.42,
    wobble: Math.random() * Math.PI * 2,
    alpha: 1
  });
  if (activeBubbles.length > 3) activeBubbles.shift();
}

function drawBackground() {
  // น้ำไล่เฉดพาสเทล
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#bce8ff');
  grad.addColorStop(0.75, '#89cff0');
  grad.addColorStop(1, '#6bb9e0');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // ผิวน้ำด้านบน
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fillRect(0, 12, W, 6);

  // ซุ้มประตูโทริอิซากุระตรงกลาง
  ctx.fillStyle = '#d47a96';
  ctx.fillRect(145, 58, 110, 8);
  ctx.fillRect(152, 74, 96, 6);
  ctx.fillRect(162, 62, 10, 135);
  ctx.fillRect(228, 62, 10, 135);
  ctx.fillStyle = '#a8526e';
  ctx.fillRect(142, 55, 116, 4);

  // ปะการังซ้าย-ขวา
  ctx.fillStyle = '#ff8fb3';
  ctx.fillRect(42, 130, 8, 65);
  ctx.fillRect(30, 145, 14, 6);
  ctx.fillRect(30, 130, 6, 18);
  ctx.fillRect(50, 150, 14, 6);
  ctx.fillRect(58, 135, 6, 18);

  ctx.fillStyle = '#ffb8d0';
  ctx.fillRect(340, 135, 8, 60);
  ctx.fillRect(328, 150, 14, 6);
  ctx.fillRect(328, 136, 6, 16);
  ctx.fillRect(348, 144, 12, 6);

  // พื้นทรายด้านล่าง
  ctx.fillStyle = '#f5deb3';
  ctx.fillRect(0, 192, W, 48);
  ctx.fillStyle = '#e6c68e';
  ctx.fillRect(0, 192, W, 4);

  // หอยไข่มุกตรงกลางพื้นทราย
  ctx.fillStyle = '#e39ff6';
  ctx.beginPath(); ctx.arc(200, 192, 16, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(200, 188, 6, 0, Math.PI * 2); ctx.fill();

  // ปลาดาว
  ctx.fillStyle = '#ff85a2';
  ctx.fillRect(285, 204, 14, 4);
  ctx.fillRect(290, 199, 4, 14);
}

function drawFish(f, t) {
  ctx.save();
  ctx.translate(Math.round(f.x), Math.round(f.y));
  if (f.type !== 'jelly') ctx.scale(f.dir * f.size, f.size);
  else ctx.scale(f.size, f.size);

  const wag = Math.sin(t * 0.12 + f.x) * 2;

  if (f.type === 'betta') {
    ctx.fillStyle = f.fin;
    ctx.fillRect(-18, -8 + wag, 10, 16);
    ctx.fillRect(-6, -12, 10, 6);
    ctx.fillRect(-4, 6, 8, 6);
    ctx.fillStyle = f.color;
    ctx.fillRect(-10, -6, 18, 12);
    ctx.fillStyle = '#222';
    ctx.fillRect(4, -3, 2, 2);
  } else if (f.type === 'koi') {
    ctx.fillStyle = f.color;
    ctx.fillRect(-16, -4 + wag * 0.6, 6, 8);
    ctx.fillRect(-10, -5, 18, 10);
    ctx.fillStyle = f.spot;
    ctx.fillRect(-4, -5, 6, 5);
    ctx.fillRect(2, 0, 5, 4);
    ctx.fillStyle = '#222';
    ctx.fillRect(4, -2, 2, 2);
  } else if (f.type === 'angel') {
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.moveTo(8, 0); ctx.lineTo(-6, -12); ctx.lineTo(-10, 0); ctx.lineTo(-6, 12);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = f.stripe;
    ctx.fillRect(-3, -7, 2, 14);
    ctx.fillStyle = '#222';
    ctx.fillRect(3, -2, 2, 2);
  } else if (f.type === 'jelly') {
    const pulse = Math.sin(t * 0.08 + f.x) * 1.5;
    ctx.fillStyle = f.color;
    ctx.fillRect(-8 - pulse * 0.5, -6, 16 + pulse, 9);
    ctx.fillRect(-6, -8, 12, 3);
    ctx.fillRect(-5, 3, 2, 7 + wag * 0.5);
    ctx.fillRect(0, 3, 2, 8 - wag * 0.5);
    ctx.fillRect(4, 3, 2, 7 + wag * 0.5);
    ctx.fillStyle = '#333';
    ctx.fillRect(-3, -2, 2, 2);
    ctx.fillRect(2, -2, 2, 2);
  } else if (f.type === 'puffer') {
    ctx.fillStyle = f.color;
    ctx.fillRect(-8, -7, 16, 14);
    ctx.fillStyle = '#fff5d6';
    ctx.fillRect(-6, 1, 12, 6);
    ctx.fillStyle = '#222';
    ctx.fillRect(4, -3, 2, 2);
  }
  ctx.restore();
}

let frame = 0;
let lastTime = performance.now();

function loop(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  frame++;

  drawBackground();

  // กลีบซากุระร่วง
  ctx.fillStyle = '#ffd1e3';
  petals.forEach(p => {
    p.x += p.vx + Math.sin(frame * 0.03 + p.phase) * 0.2;
    p.y += p.vy;
    if (p.y > 192) { p.y = 10; p.x = Math.random() * W; }
    if (p.x < 0) p.x = W;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 4, 3);
  });

  // อาหารปลา
  foods.forEach((fd, idx) => {
    fd.y += fd.vy;
    ctx.fillStyle = '#ff7b00';
    ctx.fillRect(Math.round(fd.x), Math.round(fd.y), 3, 3);
    if (fd.y >= 192) foods.splice(idx, 1);
  });

  // อัปเดตปลา
  fishes.forEach(f => {
    // ถ้ามีอาหารให้ว่ายเข้าหาอาหารที่ใกล้สุด
    if (foods.length > 0 && f.type !== 'jelly') {
      const target = foods[0];
      const dx = target.x - f.x;
      const dy = target.y - f.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 10) {
        foods.shift();
      } else {
        f.x += (dx / dist) * 1.1;
        f.y += (dy / dist) * 0.8;
        f.dir = dx >= 0 ? 1 : -1;
      }
    } else {
      f.x += f.vx;
      f.y += f.vy + Math.sin(frame * 0.03 + f.x * 0.05) * 0.12;
      if (f.x < 28 || f.x > W - 28) { f.vx *= -1; f.dir *= -1; }
      if (f.y < 32 || f.y > 175) f.vy *= -1;
    }
    drawFish(f, frame);
  });

  // ตัวจับเวลาปล่อยฟองข้อความตามความถี่ที่ตั้งไว้
  if (bubbleIntervalSec > 0 && tankMessages.length > 0) {
    bubbleTimer += dt;
    if (bubbleTimer >= bubbleIntervalSec) {
      bubbleTimer = 0;
      const m = tankMessages[msgCycleIndex % tankMessages.length];
      msgCycleIndex++;
      spawnBubble(`${m.sender}: ${m.text}`);
    }
  }

  // วาดฟองข้อความลอยขึ้นด้านบน
  activeBubbles.forEach((b, idx) => {
    b.y += b.vy;
    const bx = Math.round(b.x + Math.sin(frame * 0.05 + b.wobble) * 5);
    const by = Math.round(b.y);
    if (by < 35) b.alpha -= 0.03;

    ctx.save();
    ctx.globalAlpha = Math.max(0, b.alpha);
    ctx.font = 'bold 11px Mali, sans-serif';
    const tw = ctx.measureText(b.text).width;
    const pad = 8;
    const boxW = Math.min(tw + pad * 2, W - 20);
    const drawX = Math.max(10, Math.min(W - boxW - 10, bx - boxW / 2));

    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#4a1938';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(drawX, by - 14, boxW, 22, 10);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#d93870';
    ctx.fillText(b.text, drawX + pad, by + 1, boxW - pad * 2);
    ctx.restore();

    if (b.alpha <= 0 || by < 15) activeBubbles.splice(idx, 1);
  });

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
